defaults:
  - dataset: default
  - model: yolo11
  - tracker: bytetrack
  - classifier: team_classifier
  - ocr: jersey_ocr
  - possession: possession
  - mapping: pitch
  - pipeline: inference
  - datasets: main
  - _self_

project:
  name: MatchMind
  version: 0.1.0

paths:
  data_dir: e:/ACM code cup/MatchMind/data
  output_dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

logging:
  level: INFO
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {message}"

training:
  epochs: 150
  batch: 8          # Reduced from 16 to fit in 4GB VRAM with larger imgsz
  imgsz: 640        # Higher resolution for better accuracy
  patience: 25      # Early stopping if no improvement
  lr0: 0.01
  lrf: 0.01
  weight_decay: 0.0005 # L2 Regularization to prevent overfitting
  dropout: 0.1      # Prevent overfitting
  label_smoothing: 0.1 # Soften labels to prevent overconfidence
  cos_lr: True      # Cosine annealing learning rate
  mosaic: 1.0       # Mosaic augmentation for robustness
  mixup: 0.1        # Mixup augmentation for robustness
